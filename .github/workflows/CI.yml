name: CI
env:
  MACOSX_DEPLOYMENT_TARGET: '10.13'
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request:
    branches:
      - '**'

# CI is a PR/branch gate only. Publishing to crates.io + cutting the GitHub Release on a
# `v*` tag is owned solely by publish.yml — CI intentionally does NOT run on tags, so there
# is no second `cargo publish` racing the release workflow (which failed with "already
# uploaded" when both fired on the same tag).
jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Clippy
        run: rustup component add clippy && cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Unused dependencies
        run: |
          cargo install cargo-machete --locked
          cargo machete
        continue-on-error: true

      - name: Fmt
        run: rustup component add rustfmt && cargo fmt --all -- --check

  build:
    name: Build and test on ${{ matrix.os }} - Rust stable
    needs: rust-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --all-features --all-targets --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test (nextest, retry flaky)
        run: cargo nextest run --workspace --all-features --retries 2
